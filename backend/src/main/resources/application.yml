server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: fraudshield-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:${MYSQL_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:fraudshield_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

fraudshield:
  app:
    jwtSecret: ${JWT_SECRET:FraudShieldSecretKeyForJWTAuthentication2026EnterpriseSecurityTokenKey998877}
    jwtExpirationMs: ${JWT_EXPIRATION_MS:86400000} # 24 Hours

logging:
  level:
    root: INFO
    com.fraudshield: DEBUG
