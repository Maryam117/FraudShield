server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: fraudshield-backend

  datasource:
    url: jdbc:mysql://localhost:3306/fraudshield_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

fraudshield:
  app:
    jwtSecret: FraudShieldSecretKeyForJWTAuthentication2026EnterpriseSecurityTokenKey998877
    jwtExpirationMs: 86400000 # 24 Hours

logging:
  level:
    root: INFO
    com.fraudshield: DEBUG
